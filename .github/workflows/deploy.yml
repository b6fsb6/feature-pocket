name: test and deploy
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Tests run for main and pull requests. Preview pushes and the deploys they trigger skip them: preview is for a quick look on a phone.
  test:
    if: github.event_name != 'workflow_dispatch' && github.ref != 'refs/heads/preview'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm test

  # Only tested code goes live, and only from main. The site is the app and its hosted libraries.
  # If a branch called preview exists, its copy of the app is published too, at /preview/, so a change
  # can be tried on a phone before it reaches main.
  deploy:
    needs: test
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: |
          mkdir site
          cp index.html site/
          cp -r routines site/
          if git fetch --depth 1 origin preview; then
            mkdir site/preview
            git archive FETCH_HEAD index.html routines | tar -x -C site/preview
            sed -i 's#<title>#<title>Preview: #' site/preview/index.html
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4

  # A push to preview asks for a deploy from main, with no tests. Pages only accepts deploys from main,
  # and the deploy above publishes main and preview together, so neither overwrites the other.
  preview:
    if: github.ref == 'refs/heads/preview' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: gh workflow run deploy.yml --ref main -R ${{ github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}
